# GitLab Pages. Der Job muss "pages" heißen und sein Ergebnis als Artefakt im
# Verzeichnis public/ ablegen — deshalb liegen die statischen Quelldateien in
# static/ und werden nach dem Build von dist/ nach public/ verschoben.
image: node:22

stages:
  - deploy

pages:
  stage: deploy
  rules:
    # Nur der Standardbranch wird veröffentlicht.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    # Der Basispfad hängt von der Pages-Einstellung des Projekts ab: mit
    # eindeutiger Domain liegt die App unter /, sonst unter /reiseplaner-app/.
    # CI_PAGES_URL kennt die Wahrheit, also lesen wir sie dort ab, statt sie zu
    # raten — ein falscher Basispfad lädt weder Skript noch Service Worker.
    - export BASE_PATH="$(node -e 'const u = new URL(process.env.CI_PAGES_URL); const p = u.pathname; process.stdout.write(p.endsWith("/") ? p : p + "/")')"
    - echo "Pages-URL $CI_PAGES_URL — Basispfad $BASE_PATH"
    - npm ci --cache .npm --prefer-offline
    - npm run validate
    - npm run build
    - mv dist public
  artifacts:
    paths:
      - public
