# Spiegelt den Stand nach GitLab, wo GitLab Pages daraus deployt.
#
# Warum nicht GitLabs eigenes Mirroring: Pull-Mirroring (GitLab holt sich den
# Stand von GitHub) ist ein Premium-Feature. Push von hier aus ist kostenlos.
#
# Einmalig einzurichten:
#   1. In GitLab unter Settings → Access Tokens einen Project Access Token mit
#      der Rolle Maintainer und dem Scope write_repository anlegen.
#   2. In GitHub unter Settings → Secrets and variables → Actions ein Secret
#      GITLAB_TOKEN mit diesem Wert hinterlegen.
name: Mirror to GitLab

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push nach GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "GITLAB_TOKEN ist nicht gesetzt — Spiegelung übersprungen."
            exit 0
          fi
          git push --force "https://oauth2:${GITLAB_TOKEN}@gitlab.com/matt-meller/reiseplaner-app.git" \
            "HEAD:refs/heads/main"
