name: Deploy

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Nur der Standardbranch wird veröffentlicht, wie auch immer er heißt.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Liefert den Pfad, unter dem Pages die Seite ausliefert.
      # Kein enablement: true — das GITHUB_TOKEN darf keine Pages-Site
      # anlegen (Berechtigung "administration", die einem Workflow-Token
      # nicht erteilt werden kann). Die Site muss einmalig unter
      # Settings -> Pages mit Source "GitHub Actions" eingeschaltet werden.
      # Solange das fehlt, warnt dieser Schritt nur, und der Build läuft
      # mit dem Standardpfad weiter.
      - id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run validate
      # Basispfad aus der Pages-Konfiguration statt fest verdrahtet — sonst
      # lädt nach einem Umbenennen des Repositories nichts mehr.
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path || '/italy-collection/' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
